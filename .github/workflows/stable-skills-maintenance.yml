name: Stable skills maintenance

# This workflow is deliberately inert until release/0.3 is the live repository
# default branch. The runtime guard proves the selected ref, workflow source,
# committed control plane, live default branch, and fetched default head before
# detector code can reach an upstream provider.
on:
  schedule:
    - cron: "37 5 * * *"
  workflow_dispatch:

# G1.1 has no repository publication authority. Each job repeats the sole
# permission it needs so adding a future job cannot inherit ambient access.
permissions: {}

env:
  BASH_ENV: /dev/null

defaults:
  run:
    shell: "/usr/bin/bash --noprofile --norc -euo pipefail {0}"

concurrency:
  group: stable-skills-maintenance
  cancel-in-progress: false

jobs:
  detect:
    name: Detect stable skill drift
    if: >-
      github.repository == 'KraineOpasen/bukerov-twitch-miner-go' &&
      github.repository_id == '1297795646' &&
      github.ref == 'refs/heads/release/0.3' &&
      github.workflow_ref == 'KraineOpasen/bukerov-twitch-miner-go/.github/workflows/stable-skills-maintenance.yml@refs/heads/release/0.3'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      GIT_ALLOW_PROTOCOL: https
      GIT_CONFIG_GLOBAL: /dev/null
      GIT_CONFIG_NOSYSTEM: "1"
      GIT_TERMINAL_PROMPT: "0"
      PYTHONDONTWRITEBYTECODE: "1"
    outputs:
      any_prepare: ${{ steps.plan.outputs.any_prepare }}
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - name: Prove the pinned runner Python and Git envelope
        run: |
          [[ "${ImageOS:-}" == "ubuntu24" ]]
          [[ "${RUNNER_ARCH:-}" == "X64" ]]
          [[ "${ImageVersion:-}" =~ ^[0-9]{8}\.[0-9]+\.[0-9]+$ ]]
          python3 -I -S -B <<'PY'
          import datetime
          import json
          import os
          import platform
          import re
          import ssl
          import subprocess
          import sys
          import urllib.error
          import urllib.parse
          import urllib.request

          def fail(message):
              raise SystemExit(message)

          auth_env_keys = frozenset({
              "CONTROL_PLANE_TOKEN", "GH_TOKEN", "GITHUB_PAT", "GITHUB_TOKEN",
              "GIT_ASKPASS", "GIT_SSH", "GIT_SSH_COMMAND", "SSH_ASKPASS", "SSH_AUTH_SOCK",
          })
          proxy_env_keys = frozenset({
              "ALL_PROXY", "HTTP_PROXY", "HTTPS_PROXY", "all_proxy", "http_proxy", "https_proxy",
          })
          trust_override_env_keys = frozenset({
              "CURL_CA_BUNDLE", "GIT_PROXY_SSL_CAINFO", "GIT_SSL_CAINFO",
              "GIT_SSL_NO_VERIFY", "NO_PROXY", "OPENSSL_CONF", "OPENSSL_MODULES", "PYTHONHTTPSVERIFY",
              "SSLKEYLOGFILE", "SSL_CERT_DIR", "SSL_CERT_FILE", "no_proxy",
          })
          execution_override_env_keys = frozenset({
              "GIT_CONFIG_COUNT", "GIT_CONFIG_KEY_0", "GIT_CONFIG_VALUE_0",
              "GIT_CONFIG_PARAMETERS", "GIT_EXEC_PATH", "GIT_TEMPLATE_DIR", "NODE_EXTRA_CA_CERTS",
              "NODE_OPTIONS", "NODE_TLS_REJECT_UNAUTHORIZED",
          })
          controlled_git_env = {
              "GIT_ALLOW_PROTOCOL": "https",
              "GIT_CONFIG_GLOBAL": "/dev/null",
              "GIT_CONFIG_NOSYSTEM": "1",
              "GIT_TERMINAL_PROMPT": "0",
          }
          changed_git_env = sorted(
              key for key, value in controlled_git_env.items() if os.environ.get(key) != value
          )
          unexpected_git_env = sorted(
              key for key in os.environ
              if key.startswith("GIT_") and key not in controlled_git_env
          )
          present_auth = sorted(key for key in auth_env_keys if os.environ.get(key))
          present_proxy = sorted(key for key in proxy_env_keys if key in os.environ)
          present_trust = sorted(key for key in trust_override_env_keys if key in os.environ)
          present_execution = sorted(
              key for key in execution_override_env_keys if os.environ.get(key)
          )
          if changed_git_env:
              fail("controlled Git environment mismatch: " + ",".join(changed_git_env))
          if unexpected_git_env:
              fail("unexpected ambient Git variables are forbidden: " + ",".join(unexpected_git_env))
          if present_auth:
              fail("ambient authentication variables are forbidden: " + ",".join(present_auth))
          if present_proxy:
              fail("ambient proxy variables are forbidden: " + ",".join(present_proxy))
          if present_trust:
              fail("ambient TLS trust override variables are forbidden: " + ",".join(present_trust))
          if present_execution:
              fail("ambient Node/Git execution override variables are forbidden: " + ",".join(present_execution))

          def command_output(argv):
              command_env = {
                  "BASH_ENV": "/dev/null",
                  "GIT_ALLOW_PROTOCOL": "https",
                  "GIT_CONFIG_GLOBAL": "/dev/null",
                  "GIT_CONFIG_NOSYSTEM": "1",
                  "GIT_TERMINAL_PROMPT": "0",
                  "LANG": "C",
                  "LC_ALL": "C",
                  "PATH": os.environ.get("PATH", ""),
              }
              completed = subprocess.run(
                  argv,
                  check=False,
                  stdout=subprocess.PIPE,
                  stderr=subprocess.PIPE,
                  text=True,
                  env=command_env,
              )
              if completed.returncode != 0:
                  fail(f"tool probe failed for {argv[0]} with exit {completed.returncode}")
              return completed.stdout.strip()

          image_os = os.environ.get("ImageOS", "")
          image_version = os.environ.get("ImageVersion", "")
          runner_arch = os.environ.get("RUNNER_ARCH", "")
          if image_os != "ubuntu24":
              fail("requires ImageOS=ubuntu24")
          if runner_arch != "X64":
              fail("requires RUNNER_ARCH=X64")
          if os.environ.get("BASH_ENV") != "/dev/null":
              fail("requires BASH_ENV=/dev/null")
          if re.fullmatch(r"^[0-9]{8}\.[0-9]+\.[0-9]+$", image_version) is None:
              fail("ImageVersion does not match YYYYMMDD.build.patch")
          image_date, image_build, _image_patch = image_version.split(".")
          try:
              datetime.datetime.strptime(image_date, "%Y%m%d")
          except ValueError:
              fail("ImageVersion contains an invalid calendar date")

          if platform.python_implementation() != "CPython" or sys.implementation.name != "cpython":
              fail("requires the CPython implementation")
          if sys.version_info[:2] != (3, 12):
              fail("requires runner CPython 3.12.x")
          python_version = platform.python_version()

          git_version = command_output(["git", "--version"])
          git_match = re.fullmatch(r"git version (\d+)\.(\d+)\.(\d+)(?:\..*)?", git_version)
          if git_match is None:
              fail("unrecognized Git version")
          parsed = tuple(int(part) for part in git_match.groups())
          if not ((2, 43, 0) <= parsed < (2, 60, 0)):
              fail("Git is outside the tested [2.43.0, 2.60.0) envelope")

          bash_banner = command_output(
              ["/usr/bin/bash", "--noprofile", "--norc", "--version"]
          ).splitlines()[0]
          bash_match = re.search(
              r"\bversion (\d+)\.(\d+)\.(\d+)(?:\(\d+\))?-release\b", bash_banner
          )
          if bash_match is None:
              fail("unrecognized Bash version")
          parsed_bash = tuple(int(part) for part in bash_match.groups())
          if parsed_bash[:2] != (5, 2):
              fail("Bash is outside the tested 5.2.x envelope")
          bash_version = ".".join(str(part) for part in parsed_bash)

          release_tag = f"ubuntu24/{image_date}.{image_build}"
          encoded_tag = urllib.parse.quote(release_tag, safe="")
          release_api_url = (
              "https://api.github.com/repos/actions/runner-images/releases/tags/" + encoded_tag
          )

          class RefuseRedirects(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, headers, newurl):
                  raise urllib.error.HTTPError(
                      req.full_url, code, "redirect refused", headers, fp
                  )

          tls_context = ssl.create_default_context(purpose=ssl.Purpose.SERVER_AUTH)
          if tls_context.verify_mode != ssl.CERT_REQUIRED or not tls_context.check_hostname:
              fail("TLS verification is not fail-closed")
          opener = urllib.request.build_opener(
              urllib.request.ProxyHandler({}),
              urllib.request.HTTPSHandler(context=tls_context),
              RefuseRedirects(),
          )
          def unique_object(pairs):
              result = {}
              for key, value in pairs:
                  if key in result:
                      fail("runner-images release JSON contains a duplicate key")
                  result[key] = value
              return result

          def github_json(url, limit, label):
              request = urllib.request.Request(
                  url,
                  headers={
                      "Accept": "application/vnd.github+json",
                      "User-Agent": "stable-skills-runner-provenance/1",
                      "X-GitHub-Api-Version": "2022-11-28",
                  },
                  method="GET",
              )
              try:
                  with opener.open(request, timeout=20) as response:
                      if response.status != 200 or response.geturl() != url:
                          fail(f"unexpected {label} API response")
                      if response.headers.get_content_type() != "application/json":
                          fail(f"{label} API did not return JSON")
                      response_bytes = response.read(limit + 1)
              except (OSError, urllib.error.URLError, urllib.error.HTTPError) as error:
                  fail(f"{label} API lookup failed: {type(error).__name__}")
              if len(response_bytes) > limit:
                  fail(f"{label} API response exceeds its byte limit")
              try:
                  value = json.loads(
                      response_bytes.decode("utf-8"), object_pairs_hook=unique_object
                  )
              except (UnicodeDecodeError, json.JSONDecodeError):
                  fail(f"{label} API returned invalid UTF-8 JSON")
              if not isinstance(value, dict):
                  fail(f"{label} API root is not an object")
              return value

          repository_api_url = "https://api.github.com/repos/actions/runner-images"
          repository = github_json(repository_api_url, 1024 * 1024, "runner-images repository")
          owner = repository.get("owner")
          if (
              repository.get("id") != 190416463
              or repository.get("full_name") != "actions/runner-images"
              or repository.get("url") != repository_api_url
              or repository.get("html_url") != "https://github.com/actions/runner-images"
              or not isinstance(owner, dict)
              or owner.get("login") != "actions"
          ):
              fail("runner-images numeric repository identity mismatch")

          release = github_json(release_api_url, 2 * 1024 * 1024, "runner-images release")
          if release.get("tag_name") != release_tag:
              fail("runner-images release tag does not match ImageVersion")
          source_sha = release.get("target_commitish")
          if not isinstance(source_sha, str) or re.fullmatch(r"[0-9a-f]{40}", source_sha) is None:
              fail("runner-images target_commitish is not a full lowercase commit SHA")
          release_id = release.get("id")
          if isinstance(release_id, bool) or not isinstance(release_id, int) or release_id <= 0:
              fail("runner-images release id is invalid")
          expected_release_url = (
              f"https://api.github.com/repos/actions/runner-images/releases/{release_id}"
          )
          if release.get("url") != expected_release_url:
              fail("runner-images release API repository context is invalid")
          if release.get("assets_url") != expected_release_url + "/assets":
              fail("runner-images assets API repository context is invalid")
          html_url = release.get("html_url")
          if not isinstance(html_url, str):
              fail("runner-images release HTML URL is absent")
          parsed_html = urllib.parse.urlsplit(html_url)
          html_prefix = "/actions/runner-images/releases/tag/"
          if (
              parsed_html.scheme != "https"
              or parsed_html.netloc != "github.com"
              or parsed_html.query
              or parsed_html.fragment
              or not parsed_html.path.startswith(html_prefix)
              or urllib.parse.unquote(parsed_html.path[len(html_prefix):]) != release_tag
          ):
              fail("runner-images release HTML repository context is invalid")

          assets = release.get("assets")
          if not isinstance(assets, list) or any(not isinstance(item, dict) for item in assets):
              fail("runner-images release assets are invalid")
          manifest_matches = [item for item in assets if item.get("name") == "internal.ubuntu24.json"]
          if len(manifest_matches) != 1:
              fail("requires exactly one internal.ubuntu24.json release asset")
          manifest = manifest_matches[0]
          manifest_id = manifest.get("id")
          manifest_size = manifest.get("size")
          manifest_digest = manifest.get("digest")
          manifest_url = manifest.get("browser_download_url")
          if isinstance(manifest_id, bool) or not isinstance(manifest_id, int) or manifest_id <= 0:
              fail("runner-images provider manifest id is invalid")
          if isinstance(manifest_size, bool) or not isinstance(manifest_size, int) or manifest_size <= 0:
              fail("runner-images provider manifest size is invalid")
          if not isinstance(manifest_digest, str) or re.fullmatch(
              r"sha256:[0-9a-f]{64}", manifest_digest
          ) is None:
              fail("runner-images provider manifest digest is invalid")
          if manifest.get("state") != "uploaded":
              fail("runner-images provider manifest is not uploaded")
          if manifest.get("url") != (
              f"https://api.github.com/repos/actions/runner-images/releases/assets/{manifest_id}"
          ):
              fail("runner-images provider manifest API repository context is invalid")
          if not isinstance(manifest_url, str):
              fail("runner-images provider manifest locator is absent")
          parsed_manifest = urllib.parse.urlsplit(manifest_url)
          manifest_prefix = "/actions/runner-images/releases/download/"
          if (
              parsed_manifest.scheme != "https"
              or parsed_manifest.netloc != "github.com"
              or parsed_manifest.query
              or parsed_manifest.fragment
              or not parsed_manifest.path.startswith(manifest_prefix)
          ):
              fail("runner-images provider manifest locator is outside the release repository")
          manifest_suffix = parsed_manifest.path[len(manifest_prefix):]
          if "/" not in manifest_suffix:
              fail("runner-images provider manifest locator is malformed")
          manifest_tag, manifest_name = manifest_suffix.rsplit("/", 1)
          if (
              urllib.parse.unquote(manifest_tag) != release_tag
              or urllib.parse.unquote(manifest_name) != "internal.ubuntu24.json"
          ):
              fail("runner-images provider manifest locator does not match the release")

          included_software_url = (
              "https://raw.githubusercontent.com/actions/runner-images/"
              f"{source_sha}/images/ubuntu/Ubuntu2404-Readme.md"
          )
          summary_path = os.environ.get("GITHUB_STEP_SUMMARY", "")
          if not summary_path:
              fail("GITHUB_STEP_SUMMARY is unavailable")
          evidence = (
              "### Hosted runner provenance pre-check\n"
              f"- ImageOS: `{image_os}`\n"
              f"- ImageVersion: `{image_version}`\n"
              f"- Architecture: `{runner_arch}`\n"
              f"- Python: `CPython {python_version}`\n"
              f"- Git: `{git_version}`\n"
              f"- Bash: `{bash_version}`\n"
              f"- Runner-images release tag: `{release_tag}`\n"
              f"- Runner-images source SHA: `{source_sha}`\n"
              f"- Included software: {included_software_url}\n"
              f"- Provider manifest asset id: `{manifest_id}`\n"
              f"- Provider manifest size: `{manifest_size}`\n"
              f"- Provider manifest digest: `{manifest_digest}`\n"
              f"- Provider manifest locator: {manifest_url}\n"
              "- SBOM availability: `UNAVAILABLE_OPTIONAL_HARDENING`\n"
          )
          with open(summary_path, "a", encoding="utf-8", newline="\n") as summary_file:
              summary_file.write(evidence)
          PY

      - name: Check out the trusted stable event head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          clean: true
          fetch-depth: 1
          fetch-tags: false
          lfs: false
          persist-credentials: false
          ref: ${{ github.sha }}
          set-safe-directory: false
          show-progress: false
          submodules: false

      - name: Prove stable workflow and control-plane identity
        run: python3 -I -S -B scripts/skill_updates/runtime.py verify-workflow --repo-root .

      - name: Refuse detection when governance or updater invariants are red
        run: |
          set -euo pipefail
          python3 -I -S -B scripts/validate-agent-governance.py --self-test-hook
          python3 -I -S -B scripts/skill_updates/runtime.py verify-repository --repo-root .
          python3 -I -S -B scripts/validate-agent-governance.py --self-test
          python3 -I -S -B scripts/skill_updates/tests/mutation_probe.py --check-anchors
          python3 -I -S -B scripts/skill_updates/tests/mutation_probe.py --suite-only

      - name: Detect and classify upstream drift
        run: |
          set -euo pipefail
          python3 -I -S -B scripts/check-skill-updates.py \
            --all \
            --json-out "$RUNNER_TEMP/stable-skills-report.json" \
            --summary "$GITHUB_STEP_SUMMARY"

      - name: Build the inert preparation matrix
        id: plan
        run: |
          set -euo pipefail
          python3 -I -S -B scripts/skill_updates/plan.py \
            --report "$RUNNER_TEMP/stable-skills-report.json" \
            --mode prepare \
            --github-output "$GITHUB_OUTPUT"

  prepare:
    name: Prepare ${{ matrix.provider }} artifact
    needs: detect
    if: needs.detect.result == 'success' && needs.detect.outputs.any_prepare == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      GIT_ALLOW_PROTOCOL: https
      GIT_CONFIG_GLOBAL: /dev/null
      GIT_CONFIG_NOSYSTEM: "1"
      GIT_TERMINAL_PROMPT: "0"
      PYTHONDONTWRITEBYTECODE: "1"
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix: ${{ fromJSON(needs.detect.outputs.matrix) }}
    steps:
      - name: Prove the pinned runner Python and Git envelope
        run: |
          [[ "${ImageOS:-}" == "ubuntu24" ]]
          [[ "${RUNNER_ARCH:-}" == "X64" ]]
          [[ "${ImageVersion:-}" =~ ^[0-9]{8}\.[0-9]+\.[0-9]+$ ]]
          python3 -I -S -B <<'PY'
