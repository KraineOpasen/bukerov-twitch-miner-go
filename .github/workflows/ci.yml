name: CI

on:
  push:
    branches: [main]
    tags:
      - "v*"
  pull_request:
    branches: [main]

# Read-only by default. This workflow runs on pull_request (including from
# untrusted contributors): it must never hold write scopes, request an OIDC
# token, push a package, or create an attestation. The docker job validates the
# image build only (push: false).
permissions:
  contents: read

jobs:
  governance:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Governance validator + hook self-test
        run: python3 scripts/validate-agent-governance.py --self-test-hook

      - name: Validator fixture self-test
        run: python3 scripts/validate-agent-governance.py --self-test

      - name: Mutation probe anchors (read-only)
        run: python3 scripts/skill_updates/tests/mutation_probe.py --check-anchors

      - name: Updater regression suite
        run: python3 -m unittest discover -t scripts -s scripts/skill_updates/tests

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: v2.12.2

  build:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Verify dependencies
        run: go mod verify

      - name: Build
        run: go build -v ./...

      - name: Run tests
        run: go test -v -race ./...

  docker:
    runs-on: ubuntu-latest
    needs: [lint, build]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: twitch-miner:test
          build-args: |
            VERSION=ci-${{ github.sha }}
