services:
  twitch-miner:
    # Select an exact stable version or, preferably in production, OCI digest.
    # Upgrade only by changing this explicitly selected image after validation.
    image: "${TWITCH_MINER_IMAGE:?Set TWITCH_MINER_IMAGE to an exact ghcr.io/kraineopasen/bukerov-twitch-miner-go-stable:<version> or @sha256:<digest>}"
    container_name: twitch-miner
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      # Stable-channel self-update is disabled even if this is misconfigured;
      # upgrades use the exact image selector above.
      AUTO_UPDATE: "false"
      # How often to check GitHub Releases for a newer version. Accepts a Go
      # duration ("12h", "6h30m") or a bare number of hours ("12"). Default 8h.
      AUTO_UPDATE_CHECK_INTERVAL: "8h"
      # REQUIRED for the dashboard: the image binds the dashboard to all
      # container interfaces (DASHBOARD_HOST=0.0.0.0) so the published port
      # works, and a non-loopback bind refuses to start without credentials.
      # Uncomment and set both, or the container will exit at startup with an
      # explanatory error.
      # DASHBOARD_USERNAME: "admin"
      # DASHBOARD_PASSWORD: "change-me"
      # Alternative (NOT recommended): explicitly accept an unauthenticated
      # dashboard on a trusted network instead of setting credentials.
      # DASHBOARD_INSECURE_NO_AUTH: "true"
      # Optional: supply the Discord bot token via env instead of config.json.
      # CAUTION: while set, any config save permanently clears the token in
      # config.json (env is the source of truth) - see README, Discord section.
      # DISCORD_BOT_TOKEN: "your-bot-token"
    volumes:
      - ./config:/config
      - ./cookies:/cookies
      - ./logs:/logs
      - ./database:/database
    # Mirrors the image's built-in HEALTHCHECK (the miner binary is its own
    # probe; the scratch image has no shell or curl). Remove this block to
    # fall back to the image defaults.
    healthcheck:
      test: ["CMD", "/twitch-miner-go", "-healthcheck", "-config", "/config/config.json"]
      interval: 60s
      timeout: 10s
      start_period: 120s
      retries: 3
    labels:
      # Keep Watchtower from silently moving the exact stable image selection.
      com.centurylinklabs.watchtower.enable: "false"
