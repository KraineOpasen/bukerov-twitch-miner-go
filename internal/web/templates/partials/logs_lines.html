{{define "logs_lines"}}
{{if not .FileLogging}}
<div class="text-neutral-400 text-sm py-8 text-center">{{ t "logs.disabled" }}</div>
{{else}}{{$visible := .VisibleLines}}{{if not $visible}}
<div class="text-neutral-400 text-sm py-8 text-center">{{ t "logs.empty" }}</div>
{{else}}
{{range $visible}}<span class="log-line {{.Class}}" data-level="{{.Level}}" data-subsystem="{{.Subsystem}}"{{if .Reconnect}} data-reconnect="1"{{end}}><span class="log-emoji" aria-hidden="true">{{.Emoji}}</span><span class="log-text">{{.Text}}</span></span>
{{end}}
{{end}}
{{end}}
{{end}}
