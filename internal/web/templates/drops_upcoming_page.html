{{define "title"}}{{ t "drops.title" }} · {{ t "drops.tab.upcoming" }} - Twitch Points Miner{{end}}

{{define "content"}}
<h1 class="text-3xl font-bold mb-2">{{ t "drops.title" }} · {{ t "drops.tab.upcoming" }}</h1>
<p class="text-text-muted text-sm mb-4">{{ t "drops.upcoming.subtitle" }}</p>

<!--
    Re-reads the backend snapshot every minute so a new campaign surfaced by a
    full sync (scheduled or manual "Sync Drops now", triggered from the
    Current page) appears without a full page reload. This only re-renders
    the upcoming set the server already holds in memory — it never triggers
    a Twitch sync. Same endpoint and cadence the former inline tab used.
-->
<section id="drops-upcoming" hx-get="/api/drops/upcoming" hx-trigger="load, every 1m" hx-swap="innerHTML">
    <div class="animate-pulse text-text-muted">{{ t "drops.loading.upcoming" }}</div>
</section>
{{end}}
